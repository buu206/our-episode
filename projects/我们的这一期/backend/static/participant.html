<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朋友入口 · 我们的这一期</title><link rel="stylesheet" href="/collaboration.css"></head><body>
<header><strong>我们的这一期</strong><span class="badge">朋友入口 · 仅受邀范围</span><button id="logout" hidden>退出朋友身份</button></header>
<main><h1>补充你的那一面</h1><p class="muted">你确认自己的表达，发起人决定是否采用。</p><p id="message" class="status" role="status" aria-live="polite"></p>
<section id="login" class="section"><h2>进入受邀任务</h2><p>此入口只在当前电脑用于本机验收。邀请代码代表受邀身份，不是实名核验；请只使用发给你的邀请。</p><form id="login-form"><label for="invite-code">邀请代码</label><input id="invite-code" type="password" maxlength="200" autocomplete="off" required><label for="display-name">你的称呼</label><input id="display-name" maxlength="40" placeholder="例如：小林" required><label><input id="identity-check" type="checkbox" required>这是发给我的邀请，我以本人身份参与。</label><button class="primary" type="submit">进入我的任务</button></form></section>
<div id="workspace" hidden><section class="section"><div class="row"><h2 id="task-title">我的任务</h2><button id="refresh">刷新任务状态</button></div><p id="task-boundary" class="notice"></p><p id="entry-state"></p><div id="context"></div><div id="questions"></div><button id="save-questions" hidden>保存问题修改 / 跳过</button></section>
<section id="upload-section" class="section"><h2>上传草稿，先自己看</h2><p id="upload-help" class="muted"></p><form id="upload-form"><label for="question-id">对应问题（可选）</label><select id="question-id"><option value="">不指定</option></select><label for="upload-kind">文件类型</label><select id="upload-kind"><option value="video">视频</option><option value="audio">语音</option></select><label for="upload-file">选择本人录音或视频文件</label><input id="upload-file" type="file" required><label for="upload-text">希望呈现的文字说明（可选，最多100字）</label><textarea id="upload-text" maxlength="100" placeholder="由你自己填写，不是自动转写。"></textarea><button class="primary" type="submit">上传为我的草稿</button></form><p class="muted">上传后先在下方预听/预看；点击确认提交之前，发起人看不到草稿。只有你本人或已获授权的成年人素材可以提交。</p></section>
<section class="section"><h2>我的稿件与表达确认</h2><div id="submissions"></div></section>
<section class="section"><h2>表达异议与处理</h2><p class="muted">你可以对邀请中明确开放的片段，或自己的稿件提出异议。未解决的相关内容不能继续使用；只有你能确认自己提出的问题已解决。</p><form id="objection-form"><label for="objection-target">针对哪一项</label><select id="objection-target"></select><div class="grid"><div><label for="objection-start">开始（秒）</label><input id="objection-start" type="number" min="0" step="0.01"></div><div><label for="objection-end">结束（秒）</label><input id="objection-end" type="number" min="0.01" step="0.01"></div></div><label for="objection-reason">哪里不符合你的意思，希望怎样处理</label><textarea id="objection-reason" maxlength="1000" required></textarea><button type="submit">提交这条异议</button></form><div id="objections"></div></section>
</div></main><dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="row"><button id="confirm-no">取消</button><button id="confirm-yes" class="primary">确认</button></div></dialog>
<script src="/collaboration-common.js"></script><script>
let identity=null,invite=null,submissions=[],objections=[],questionInputs=[],pollTimer,uploadRequestId=crypto.randomUUID();
const fragment=new URLSearchParams(location.hash.slice(1));if(fragment.has('code')){$('invite-code').value=fragment.get('code');history.replaceState(null,'',location.pathname);}
const entryOpen=()=>Boolean(invite?.accepting_new);
function configureUpload(){const contribution=invite?.role==='contribute';$('upload-kind').querySelector('option[value="audio"]').disabled=contribution;if(contribution)$('upload-kind').value='video';$('upload-file').accept=$('upload-kind').value==='audio'?'.wav,.mp3,.m4a':'.mp4,.mov';}
function renderInvitation(){const open=entryOpen();$('task-title').textContent=identity.display_name+' · '+({contribute:'补充现场视频',interview:'补一段事后采访',review:'核对指定片段'}[invite.role]||'受邀任务');$('task-boundary').textContent='你只能查看本任务的必要片段和自己的投稿；这不授予整期原片、他人采访或成片的访问权。问题和文字均由人填写，本轮不调用 AI。';$('entry-state').textContent=open?'邀请有效至 '+new Date(invite.expires_at*1000).toLocaleString():'邀请已关闭或到期，不能新增投稿；你仍可管理已提交的内容、确认修订、撤回授权和处理异议。';
const context=$('context');context.replaceChildren();if(invite.context){context.append(paragraph('允许查看的原片区间：'+invite.context.start+'–'+invite.context.end+' 秒。下方播放器是该区间的独立片段，计时从0开始。'));if(invite.context_preview_url)context.append(mediaPlayer(invite.context_preview_url));else context.append(paragraph('上下文片段：'+stateName(invite.context_state)));if(invite.context_error)context.append(paragraph(invite.context_error.message));}else context.append(paragraph('这次邀请仅用于补充现场视频，不开放原片。'));
const questions=$('questions');questions.replaceChildren();questionInputs=[];const prior=$('question-id').value;$('question-id').replaceChildren(el('option','不指定'));$('question-id').firstChild.value='';for(const q of invite.questions||[]){const card=el('div',undefined,'item'),text=el('textarea');text.maxLength=200;text.value=q.text;text.disabled=!open||invite.role==='review';const skipped=input('','checkbox');skipped.checked=q.skipped;skipped.disabled=!open||invite.role==='review';const label=el('label');label.append(skipped,document.createTextNode('我选择跳过这个问题'));card.append(field('问题（可以改成你更愿意回答的问法）',text),label);questions.append(card);questionInputs.push({id:q.id,text,skipped});const option=el('option',q.text);option.value=q.id;$('question-id').append(option);}if([...$('question-id').options].some(o=>o.value===prior))$('question-id').value=prior;$('save-questions').hidden=!questionInputs.length||invite.role==='review';$('save-questions').disabled=!open;$('upload-section').hidden=invite.role==='review'||!open;$('upload-help').textContent=invite.role==='contribute'?'补充现场视频支持MP4/MOV，所有原始来源共用每期8份、10分钟、1GB限额，草稿也计入。':'语音支持WAV/MP3/M4A，视频支持MP4/MOV；每份采访最多60秒、100MB，必须有本人原声。它会作为事后采访呈现。';configureUpload();}
function renderSubmissions(){const list=$('submissions');list.replaceChildren();for(const sub of submissions){const card=el('div',undefined,'item');if(sub.can_delete_draft)card.append(button(sub.deletion_pending?'重试删除草稿文件':'删除未提交草稿及应用副本',async()=>{if(!await confirmAction('删除这份未提交草稿？','只删除本应用保存的草稿文字、原始副本和预览，释放本期额度。你电脑上原来的文件不受影响；删除后不能恢复这份草稿。','确认删除草稿'))return;await api('/participant/submissions/'+ident(sub.id)+'?confirm=true',{method:'DELETE'});await refresh();notice('草稿应用副本已删除，额度已释放。');},'danger'));if(sub.deleted){card.append(el('h3',sub.deletion_pending?'草稿已停止访问，文件清理待重试':'草稿已删除'),paragraph(sub.deletion_pending?'剩余文件暂占额度，完成物理清理后才释放。':'应用副本已清理，外部原文件保留。'));list.append(card);continue;}card.append(el('h3',(sub.filename||'文字稿件')+' · '+stateName(sub.state)),paragraph('你的文字说明：'+(sub.text||'未填写')));if(sub.media_url)card.append(mediaPlayer(sub.media_url));else if(sub.preview_state)card.append(paragraph('本人预览：'+stateName(sub.preview_state)));if(sub.preview_error)card.append(paragraph(sub.preview_error.message));
if(sub.state==='draft'){const editor=details('修改我的草稿文字');const draftText=el('textarea');draftText.maxLength=100;draftText.value=sub.text||'';editor.append(field('自己的文字说明（最多100字）',draftText),button('保存草稿文字',async()=>{await api('/participant/submissions/'+ident(sub.id),{method:'PUT',body:{text:draftText.value,question_id:sub.question_id}});await refresh();notice('草稿文字已保存，请重新核对后再提交。');}));card.append(editor);if(sub.preview_state==='failed')card.append(button('重试本机预览处理',async()=>{await api('/participant/submissions/'+ident(sub.id)+'/retry',{method:'POST',body:{}});await refresh();notice('已从保存的原文件重新处理，不用再次上传。');}));const confirmation=input('','checkbox');const label=el('label');label.append(confirmation,document.createTextNode('我已完整预览，确认这是我的表达，并同意发起人按这份内容用于本期。'));card.append(label);const submit=button('确认并提交给发起人',async()=>{if(!confirmation.checked)throw new Error('请先完整预览，并勾选本人确认。');if(!await confirmAction('提交这份表达？','发起人将能查看并决定是否采用。今后的改写或截短仍需你确认；你可以撤回使用授权。','本人确认，提交'))return;await api('/participant/submissions/'+ident(sub.id)+'/submit',{method:'POST',body:{confirmed:true}});await refresh();notice('已确认提交。是否采用由发起人决定。');},'primary');submit.disabled=!['ready','succeeded'].includes(sub.preview_state)&&sub.kind!=='text';card.append(submit);}
for(const revision of sub.revisions||[]){if(revision.state==='proposed'){const proposal=el('div',undefined,'notice');proposal.append(el('h3','发起人提出的新修订，需要你核对'),paragraph('文字说明：'+(revision.text||'不添加文字说明')),paragraph('拟使用的原声区间：'+revision.start+'–'+revision.end+' 秒（对应你的原始稿件）'));const buttons=el('div',undefined,'row');buttons.append(button('这份修订符合我的意思',async()=>{if(!await confirmAction('确认这个具体修订？','请回看原始稿件，核对上方文字和截短区间。这次确认只针对这份修订，不授权所有未来改写。','确认此修订'))return;await api('/participant/revisions/'+ident(revision.id)+'/decision',{method:'POST',body:{decision:'confirmed'}});await refresh();notice('此修订已由你确认，等待发起人决定是否采用。');},'primary'),button('不接受这份修订',async()=>{await api('/participant/revisions/'+ident(revision.id)+'/decision',{method:'POST',body:{decision:'rejected'}});await refresh();notice('已记录不接受，发起人不能采用这份修订。');}));proposal.append(buttons);card.append(proposal);}}
if(sub.state!=='withdrawn')card.append(button(sub.state==='draft'?'放弃这份草稿':'撤回这份内容的使用授权',async()=>{if(!await confirmAction('撤回使用授权？','相关候选和旧版本将不能继续使用这份内容。本机文件按既定规则保留；已导出到其他设备的副本无法自动收回。','确认撤回'))return;await api('/participant/submissions/'+ident(sub.id)+'/withdraw',{method:'POST',body:{confirmed:true}});await refresh();notice('使用授权已撤回，相关内容已受限。本机文件仍保留。');},'danger'));list.append(card);}empty(list,'你还没有上传稿件。可以跳过采访，不影响发起人已有成片。');}
function objectionRange(){const id=$('objection-target').value,sub=submissions.find(s=>s.id===id);if(id==='context'&&invite.context){$('objection-start').labels[0].textContent='原片开始（秒；预览0秒对应原片'+invite.context.start+'秒）';$('objection-end').labels[0].textContent='原片结束（秒）';$('objection-start').value=invite.context.start;$('objection-end').value=invite.context.end;}else{$('objection-start').labels[0].textContent='开始（秒）';$('objection-end').labels[0].textContent='结束（秒）';$('objection-start').value=0;$('objection-end').value=sub?.duration||0;}for(const name of ['objection-start','objection-end']){$(name).disabled=sub?.kind==='text';$(name).parentElement.hidden=sub?.kind==='text';}}
function renderObjections(){const selected=$('objection-target').value;$('objection-target').replaceChildren();if(invite.context){const option=el('option','邀请里开放的原片区间');option.value='context';$('objection-target').append(option);}for(const sub of submissions.filter(s=>['submitted','withdrawn'].includes(s.state))){const option=el('option',sub.filename||'我的文字稿件');option.value=sub.id;$('objection-target').append(option);}if([...$('objection-target').options].some(o=>o.value===selected))$('objection-target').value=selected;objectionRange();$('objection-form').hidden=!$('objection-target').options.length;const list=$('objections');list.replaceChildren();for(const item of objections){const card=el('div',undefined,'item');card.append(el('h3',stateName(item.state)),paragraph(item.reason));if(item.start!=null)card.append(paragraph('区间：'+item.start+'–'+item.end+' 秒'));if(item.state==='open')card.append(button('我确认这条问题已解决',async()=>{if(!await confirmAction('确认异议已解决？','仅在你认可处理结果后确认。发起人不能代你操作；确认后相关版本仍需要重新核对。','本人确认已解决'))return;await api('/participant/objections/'+ident(item.id)+'/resolve',{method:'POST',body:{confirmed:true}});await refresh();notice('你已确认解决这条异议。');}));list.append(card);}empty(list,'你尚未提出异议。');}
function scheduleRefresh(){clearTimeout(pollTimer);pollTimer=setTimeout(()=>{if(busy||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.querySelector('video:not([data-idle])')&&Array.from(document.querySelectorAll('video')).some(v=>!v.paused)){scheduleRefresh();return;}refresh().catch(e=>notice(e.message,true));},1800);}
async function refresh(){clearTimeout(pollTimer);const current=await api('/participant/auth/me');if(identity&&identity.participant_id!==current.participant_id){$('upload-file').value='';$('upload-text').value='';$('objection-reason').value='';uploadRequestId=crypto.randomUUID();notice('朋友身份已在另一个标签页切换，现在显示当前登录者的任务。请重新核对后操作。');}identity=current;csrf=current.csrf_token;const data=await Promise.all([api('/participant/invitation'),api('/participant/submissions'),api('/participant/objections')]);invite=data[0];submissions=data[1].items;objections=data[2].items;$('login').hidden=true;$('workspace').hidden=false;$('logout').hidden=false;renderInvitation();renderSubmissions();renderObjections();const working=['queued','running','pending'].includes(invite.context_state)||submissions.some(s=>['queued','running','pending'].includes(s.preview_state));if(working)scheduleRefresh();}
$('login-form').addEventListener('submit',event=>{event.preventDefault();action('正在进入你的任务…',async()=>{identity=await api('/participant/auth/login',{method:'POST',body:{invite_code:$('invite-code').value,display_name:$('display-name').value.trim()}});csrf=identity.csrf_token;$('invite-code').value='';await refresh();notice('已进入你的受邀任务。');});});
$('logout').addEventListener('click',()=>action('正在退出…',async()=>{await api('/participant/auth/logout',{method:'POST',body:{}});csrf='';identity=null;clearTimeout(pollTimer);$('workspace').hidden=true;$('logout').hidden=true;$('login').hidden=false;notice('已退出朋友身份，发起人的会话不受影响。');}));
$('save-questions').addEventListener('click',()=>action('正在保存你的选择…',async()=>{await api('/participant/invitation/questions',{method:'PUT',body:{questions:questionInputs.map(q=>({id:q.id,text:q.text.value.trim(),skipped:q.skipped.checked}))}});await refresh();notice('问题修改与跳过状态已保存。跳过不会被当作同意公开。');}));
$('upload-kind').addEventListener('change',configureUpload);for(const id of ['upload-kind','upload-file','upload-text','question-id'])$(id).addEventListener('change',()=>{uploadRequestId=crypto.randomUUID();});
$('upload-form').addEventListener('submit',event=>{event.preventDefault();action('正在上传并校验草稿…',async()=>{const file=$('upload-file').files[0];if(!file)throw new Error('请先选择录音或视频。');const body=new FormData();body.append('file',file);body.append('kind',$('upload-kind').value);body.append('text',$('upload-text').value);body.append('client_request_id',uploadRequestId);if($('question-id').value)body.append('question_id',$('question-id').value);await api('/participant/submissions/upload',{method:'POST',body});uploadRequestId=crypto.randomUUID();$('upload-file').value='';$('upload-text').value='';await refresh();notice('草稿已保存，先在下方完整预览，再由你确认提交。');});});
$('objection-target').addEventListener('change',objectionRange);$('objection-form').addEventListener('submit',event=>{event.preventDefault();action('正在登记你的异议…',async()=>{const target=$('objection-target').value,body={reason:$('objection-reason').value.trim(),start:Number($('objection-start').value),end:Number($('objection-end').value)};if(target!=='context'){body.submission_id=target;if(submissions.find(s=>s.id===target)?.kind==='text'){delete body.start;delete body.end;}}await api('/participant/objections',{method:'POST',body});$('objection-reason').value='';await refresh();notice('异议已登记，相关内容在解决或移除前受到限制。');});});
$('refresh').addEventListener('click',()=>action('正在刷新…',async()=>{await refresh();notice('任务状态已刷新。');}));
async function boot(){try{identity=await api('/participant/auth/me');csrf=identity.csrf_token;$('logout').hidden=false;if($('invite-code').value){notice('你已有朋友会话。若此链接属于另一位受邀者，请先退出，再使用该邀请代码登录。');return;}await refresh();}catch(error){if(error.status!==401)notice(error.message,true);}}boot();
</script></body></html>
