<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>观看这一期 · 我们的这一期</title><link rel="stylesheet" href="/collaboration.css"></head><body>
<header><strong>我们的这一期</strong><span class="badge">熟人观看 · 仅指定成片</span><button id="logout" hidden>退出观看身份</button></header>
<main><h1>一起看这一版</h1><p id="message" class="status" role="status" aria-live="polite"></p>
<section id="login" class="section"><h2>进入受邀观看</h2><p>这是本机验收入口。观看代码只授权对应成片，不授予原片、采访或编辑权限；持有同一代码的人拥有同一观看范围。</p>
<form id="login-form"><label for="viewer-code">观看代码</label><input id="viewer-code" type="password" maxlength="200" autocomplete="off" required>
<label><input id="viewer-consent" type="checkbox" required>这是发给我的观看邀请，我会尊重参与者的分享范围。</label><button class="primary" type="submit">进入观看</button></form></section>
<section id="watch" class="section" hidden><div class="row"><h2 id="film-title"></h2><span id="share-state" class="badge"></span><button id="refresh">检查最新状态</button></div>
<p id="film-detail" class="muted"></p><p id="scope" class="notice"></p>
<video id="film" controls playsinline preload="metadata" hidden></video><p id="unavailable" class="notice" hidden></p>
<p class="muted">只提供当前授权版本的观看入口。请勿擅自扩大传播范围；链接可能被转发，媒体可能被保存或录屏，产品不能统一收回已接收的副本。</p></section>
</main><script src="/collaboration-common.js"></script><script src="/watch.js"></script></body></html>
