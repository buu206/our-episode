services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    env_file: private/app.env
    environment:
      APP_ORIGIN: https://${APP_HOST:?Set APP_HOST to your domain}
      APP_INVITES_FILE: /run/secrets/invites.json
      LOCAL_DEMO_ENTRY: "0"
    volumes:
      - app_data:/srv/app/data
      - ./private/invites.json:/run/secrets/invites.json:ro
    # No public API or app port; only the HTTPS gateway is exposed.
    security_opt:
      - no-new-privileges:true
  gateway:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST to your domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  app_data:
  caddy_data:
  caddy_config:
